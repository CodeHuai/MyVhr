    port: 465
    username: yourmail@qq.com
    password: 你的SMTP授权码
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
          debug: false
  thymeleaf:
    cache: false
server:
